<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red de Exalumnos - Colegio Arturo Prat Ch.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse para leer Google Sheets CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        .banner-bg {
            background-color: #0d233a; /* Azul marino institucional */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- ENCABEZADO CON TU BANNER.JPG -->
    <header class="banner-bg shadow-md border-b-4 border-yellow-400">
        <div class="max-w-6xl mx-auto">
            <img src="banner.jpg" alt="Comunidad de Exalumnos - Colegio Arturo Prat Ch" class="w-full h-auto object-contain mx-auto block">
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- BUSCADOR Y FILTROS -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">¿Qué servicio o producto buscas?</label>
                <input type="text" id="buscador" placeholder="Ej: pastelería, gasfitería, ropa, diseño..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0d233a] text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Tipo</label>
                <select id="filtroTipo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0d233a] text-sm bg-white">
                    <option value="">Todo (Emprendimientos y Servicios)</option>
                    <option value="Emprendimiento">Emprendimiento</option>
                    <option value="Servicio">Servicio</option>
                </select>
            </div>
        </div>

        <!-- CONTENEDOR DE TARJETAS -->
        <div id="contenedor-publicaciones" class="space-y-4">
            <div class="text-center py-12 text-gray-400">Cargando directorio de la comunidad...</div>
        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-[#0d233a] text-white text-center py-6 mt-12 border-t-4 border-yellow-400 text-sm">
        <p class="font-semibold">Red de Exalumnos • Colegio Arturo Prat Ch. (Valparaíso)</p>
        <p class="text-yellow-200 text-xs mt-1">Conectando y apoyando el talento de nuestra comunidad.</p>
    </footer>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTyH2h9Dm2gJ4nJd0NLFni3ILWw-5UQOZckDC9pXEERddJGnezRJRS8HVp0lFls984whW0ByTkEkljq/pub?gid=0&single=true&output=csv';
        let listaPublicaciones = [];

        function cargarDatos() {
            Papa.parse(URL_CSV, {
                download: true,
                header: true,
                complete: function(results) {
                    listaPublicaciones = results.data.filter(item => item.id && item.estado && item.estado.toLowerCase() === 'activo');
                    mostrarPublicaciones(listaPublicaciones);
                },
                error: function(err) {
                    console.error("Error al cargar Google Sheets:", err);
                    document.getElementById('contenedor-publicaciones').innerHTML = 
                        '<p class="text-center text-red-500 py-8">No se pudo cargar la información en este momento. Intenta más tarde.</p>';
                }
            });
        }

        function generarEnlaceYTexto(tipoRaw, valorRaw, esSegundoBoton) {
            let valor = valorRaw ? valorRaw.trim() : '';
            if (!valor) return null;

            let tipo = tipoRaw ? tipoRaw.toLowerCase().trim() : '';
            let enlace = '';
            let texto = '';
            let atributos = 'target="_blank" rel="noopener noreferrer"';

            if (tipo === 'whatsapp') {
                enlace = `https://wa.me/${valor.replace(/\D/g, '')}`;
                texto = esSegundoBoton ? 'Contacto 💬' : 'WhatsApp 💬';
            } else if (tipo === 'email' || tipo === 'correo') {
                enlace = `mailto:${valor}`;
                texto = esSegundoBoton ? 'Contacto ✉️' : 'Correo ✉️';
                atributos = '';
            } else if (tipo === 'telefono' || tipo === 'teléfono') {
                enlace = `tel:${valor.replace(/\s+/g, '')}`;
                texto = esSegundoBoton ? 'Contacto 📞' : 'Llamar 📞';
                atributos = '';
            } else {
                enlace = valor.startsWith('http') ? valor : `https://${valor}`;
                texto = esSegundoBoton ? 'Contacto ↗' : 'Ver sitio ↗';
            }

            return { enlace, texto, atributos };
        }

        function mostrarPublicaciones(datos) {
            const contenedor = document.getElementById('contenedor-publicaciones');
            contenedor.innerHTML = '';

            if (datos.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-gray-500 py-12 bg-white rounded-xl border border-gray-200">No se encontraron emprendimientos o servicios con esos criterios.</p>';
                return;
            }

            datos.forEach(pub => {
                let datosBtn1 = generarEnlaceYTexto(pub.contacto_tipo, pub.contacto_valor, false);
                let datosBtn2 = generarEnlaceYTexto(pub.contacto_tipo_2, pub.contacto_valor_2, true);

                let botonesHTML = '';

                // Botón principal
                if (datosBtn1) {
                    botonesHTML += `<a href="${datosBtn1.enlace}" ${datosBtn1.atributos} class="px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-all bg-[#0d233a] hover:bg-[#163558] text-white whitespace-nowrap text-center">
                        ${datosBtn1.texto}
                    </a>`;
                }

                // Segundo botón (Contacto)
                if (datosBtn2) {
                    botonesHTML += `<a href="${datosBtn2.enlace}" ${datosBtn2.atributos} class="px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-all bg-red-600 hover:bg-red-700 text-white whitespace-nowrap text-center">
                        ${datosBtn2.texto}
                    </a>`;
                }

                let tarjeta = document.createElement('div');
                tarjeta.className = 'bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:shadow-md transition-shadow border-l-4 border-l-red-600';
                
                tarjeta.innerHTML = `
                    <div class="space-y-2 flex-grow">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-0.5 text-xs font-bold rounded-full ${pub.categoria === 'Emprendimiento' ? 'bg-blue-50 text-blue-800 border border-blue-200' : 'bg-amber-50 text-amber-800 border border-amber-200'}">${pub.categoria}</span>
                            <span class="text-xs text-gray-500 flex items-center gap-1 font-medium">📍 ${pub.comuna || 'Valparaíso'}</span>
                        </div>
                        <h2 class="text-xl font-bold text-[#0d233a]">${pub.titulo}</h2>
                        <p class="text-sm font-semibold text-red-600">${pub.organizacion}</p>
                        <p class="text-sm text-gray-600 leading-relaxed">${pub.descripcion}</p>
                    </div>
                    <div class="w-full md:w-auto flex flex-wrap items-center justify-end gap-2 flex-shrink-0">
                        ${botonesHTML}
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        function filtrar() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const tipo = document.getElementById('filtroTipo').value;

            const filtrados = listaPublicaciones.filter(pub => {
                const coincideTexto = (pub.titulo && pub.titulo.toLowerCase().includes(texto)) ||
                                     (pub.descripcion && pub.descripcion.toLowerCase().includes(texto)) ||
                                     (pub.organizacion && pub.organizacion.toLowerCase().includes(texto)) ||
                                     (pub.comuna && pub.comuna.toLowerCase().includes(texto));
                const coincideTipo = tipo === "" || pub.categoria === tipo;
                return coincideTexto && coincideTipo;
            });

            mostrarPublicaciones(filtrados);
        }

        document.getElementById('buscador').addEventListener('input', filtrar);
        document.getElementById('filtroTipo').addEventListener('change', filtrar);

        window.onload = cargarDatos;
    </script>
</body>
</html>
